<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIGGRAPH Asia Scenes</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #111;
        color: #eee;
        margin: 0;
        padding: 2rem;
      }
      h1 { font-weight: 500; }
      ul { list-style: none; padding: 0; }
      li { margin: 0.5rem 0; }
      a {
        color: #6cf;
        text-decoration: none;
        padding: 0.5rem 1rem;
        background: #222;
        border-radius: 6px;
        display: inline-block;
      }
      a:hover { background: #333; }
    </style>
  </head>
  <body>
    <h1>Scenes</h1>
    <ul id="scene-list"></ul>
    <script type="module">
      const scenes = import.meta.glob('./scene_*/index.html');
      const list = document.getElementById('scene-list');
      for (const path of Object.keys(scenes)) {
        const name = path.split('/')[1];
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = `./${name}/`;
        a.textContent = name;
        li.appendChild(a);
        list.appendChild(li);
      }
    </script>
  </body>
</html>
